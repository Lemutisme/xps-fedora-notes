# Reference configuration; enable PAM only after enrollment and verification.
[core]
detection_notice = false
timeout_notice = true
no_confirmation = true
suppress_unknown = true
abort_if_ssh = true
abort_if_lid_closed = true
disabled = true
use_cnn = false
workaround = off

[video]
certainty = 3.5
timeout = 8
device_path = /dev/v4l/by-path/pci-0000:00:14.0-usb-0:7:1.2-video-index0
warn_no_device = true
max_height = 360
frame_width = 360
frame_height = 360
dark_threshold = 60
recording_plugin = opencv
device_format = v4l2
force_mjpeg = false
exposure = -1
device_fps = 15
rotate = 0

[snapshots]
save_failed = false
save_successful = false

[rubberstamps]
enabled = false
stamp_rules =
	nod		5s		failsafe     min_distance=12

[debug]
end_report = false
verbose_stamps = false
gtk_stdout = false
